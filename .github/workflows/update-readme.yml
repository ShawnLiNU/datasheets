name: Update README

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/update_readme.py"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild datasheet list
        run: python3 .github/scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update datasheet list in README"
          git push
